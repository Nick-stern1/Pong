<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --room:#241e18;
    --room-lift:#2f2720;
    --cabinet:#a8894b;
    --cabinet-hi:#c4a463;
    --cabinet-lo:#6f5930;
    --bezel:#14120e;
    --ink:#efe7d6;
    --ink-dim:#a89a80;
    --readout:#e6b95c;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:
      radial-gradient(120% 90% at 50% 0%, var(--room-lift) 0%, var(--room) 60%);
    color:var(--ink);
    font-family:'Archivo', 'Helvetica Neue', Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(12px,3vw,40px);
    -webkit-font-smoothing:antialiased;
  }

  .cabinet{
    width:min(920px,100%);
    background:linear-gradient(180deg,var(--cabinet-hi) 0%,var(--cabinet) 22%,var(--cabinet-lo) 100%);
    border-radius:10px 10px 4px 4px;
    padding:clamp(14px,2.2vw,26px);
    position:relative;
    box-shadow:
      0 1px 0 rgba(255,255,255,.28) inset,
      0 -2px 0 rgba(0,0,0,.3) inset,
      0 30px 60px -20px rgba(0,0,0,.75);
  }

  /* corner screws — the one flourish */
  .cabinet::before,.cabinet::after,
  .screws::before,.screws::after{
    content:"";
    position:absolute;
    width:7px;height:7px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#d9c28d,#6b5528 70%);
    box-shadow:0 1px 1px rgba(0,0,0,.45);
  }
  .cabinet::before{top:9px;left:9px}
  .cabinet::after{top:9px;right:9px}
  .screws::before{bottom:9px;left:9px}
  .screws::after{bottom:9px;right:9px}

  .marquee{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:0 4px clamp(10px,1.6vw,16px);
  }

  .wordmark{
    font-size:clamp(28px,5.2vw,46px);
    font-weight:700;
    letter-spacing:-.045em;
    color:#241e18;
    line-height:.9;
  }

  .origin{
    font-size:clamp(10px,1.4vw,13px);
    font-weight:500;
    color:rgba(36,30,24,.62);
    letter-spacing:.01em;
    text-align:right;
  }

  .deck{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:clamp(10px,1.8vw,22px);
    align-items:stretch;
  }

  .control{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
    min-width:clamp(62px,9vw,104px);
    color:#241e18;
  }
  .control.right{text-align:right;align-items:flex-end}

  .control .who{
    font-size:clamp(11px,1.5vw,14px);
    font-weight:700;
    letter-spacing:-.01em;
  }
  .control .keys{
    display:flex;gap:5px;
  }
  .control .key{
    min-width:26px;
    padding:5px 0;
    text-align:center;
    font-size:12px;
    font-weight:700;
    border-radius:4px;
    background:linear-gradient(180deg,#f2e3bd,#c9ac6c);
    border:1px solid rgba(36,30,24,.35);
    box-shadow:0 2px 0 rgba(36,30,24,.35);
    color:#241e18;
  }
  .control .key.live{
    transform:translateY(2px);
    box-shadow:0 0 0 rgba(36,30,24,.35);
    background:linear-gradient(180deg,#c9ac6c,#a8894b);
  }

  .screen{
    position:relative;
    background:var(--bezel);
    border-radius:6px;
    padding:clamp(8px,1.2vw,14px);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.6),
      0 10px 24px -12px rgba(0,0,0,.9) inset;
  }

  canvas{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:4/3;
    background:#000;
    border-radius:3px;
    touch-action:none;
  }

  .overlay{
    position:absolute;
    inset:clamp(8px,1.2vw,14px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:rgba(0,0,0,.72);
    border-radius:3px;
    text-align:center;
    padding:20px;
  }
  .overlay[hidden]{display:none}

  .overlay p{
    font-size:clamp(13px,1.8vw,16px);
    color:var(--ink-dim);
    max-width:38ch;
    line-height:1.5;
  }

  button{
    font:inherit;
    font-weight:700;
    font-size:clamp(14px,1.9vw,17px);
    color:#241e18;
    background:linear-gradient(180deg,#f2e3bd,#c9ac6c);
    border:1px solid rgba(0,0,0,.4);
    border-radius:5px;
    padding:11px 26px;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.45);
  }
  button:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.45)}
  button:focus-visible{outline:3px solid var(--readout);outline-offset:3px}

  .readouts{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:clamp(10px,1.6vw,16px);
    padding:0 4px;
    flex-wrap:wrap;
  }

  .gauge{
    display:flex;
    align-items:baseline;
    gap:7px;
    color:#241e18;
    font-size:clamp(11px,1.5vw,13px);
    font-weight:500;
  }
  .gauge b{
    font-weight:700;
    font-variant-numeric:tabular-nums;
    font-size:clamp(14px,2vw,17px);
  }

  .bar{
    flex:1 1 120px;
    height:8px;
    min-width:90px;
    border-radius:99px;
    background:rgba(36,30,24,.3);
    overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.2);
  }
  .bar span{
    display:block;
    height:100%;
    width:0%;
    background:var(--readout);
    border-radius:99px;
    transition:width .18s linear;
  }
  @media (prefers-reduced-motion:reduce){
    .bar span{transition:none}
  }

  .hint{
    margin-top:14px;
    text-align:center;
    font-size:12px;
    color:rgba(239,231,214,.45);
  }

  @media (max-width:560px){
    .deck{grid-template-columns:1fr}
    .control{flex-direction:row;align-items:center;justify-content:space-between;min-width:0}
    .control.right{text-align:left;align-items:center}
  }
</style>
</head>
<body>

<main class="cabinet">
  <div class="screws"></div>

  <header class="marquee">
    <div class="wordmark">Pong</div>
    <div class="origin">Two players, one ball<br>First to eleven</div>
  </header>

  <div class="deck">
    <div class="control left">
      <span class="who">Left player</span>
      <span class="keys"><span class="key" data-key="w">W</span><span class="key" data-key="s">S</span></span>
    </div>

    <div class="screen">
      <canvas id="game" width="800" height="600" aria-label="Pong playing field"></canvas>
      <div class="overlay" id="overlay">
        <p id="overlayText">Left paddle uses W and S. Right paddle uses the up and down arrows. On a touchscreen, drag on either half of the field.</p>
        <button id="startBtn">Start the rally</button>
      </div>
    </div>

    <div class="control right">
      <span class="who">Right player</span>
      <span class="keys"><span class="key" data-key="arrowup">↑</span><span class="key" data-key="arrowdown">↓</span></span>
    </div>
  </div>

  <div class="readouts">
    <div class="gauge">Rally <b id="rally">0</b></div>
    <div class="bar"><span id="speedBar"></span></div>
    <div class="gauge">Ball speed <b id="speed">1.00×</b></div>
  </div>
</main>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const rallyOut = document.getElementById('rally');
  const speedOut = document.getElementById('speed');
  const speedBar = document.getElementById('speedBar');

  const W = 800, H = 600;
  const PW = 15, PH = 100, BS = 15;
  const PADDLE_SPEED = 6;
  const BASE_SPEED = 5;
  const SPEEDUP_EVERY = 4;     // paddle hits between speed bumps
  const SPEEDUP_FACTOR = 1.15;
  const MAX_MULT = 2.0;
  const WIN_SCORE = 11;

  const left  = { x: 30,        y: H/2 - PH/2 };
  const right = { x: W - 45,    y: H/2 - PH/2 };

  const ball = { x: 0, y: 0, sx: 0, sy: 0, mult: 1, hits: 0 };
  let scoreL = 0, scoreR = 0;
  let running = false, over = false;

  const keys = Object.create(null);
  const touch = { left: null, right: null };

  function resetBall(towards) {
    ball.mult = 1;
    ball.hits = 0;
    ball.x = W/2 - BS/2;
    ball.y = H/2 - BS/2;
    const dir = towards || (Math.random() < 0.5 ? -1 : 1);
    ball.sx = BASE_SPEED * dir;
    ball.sy = BASE_SPEED * (Math.random() < 0.5 ? -1 : 1);
    updateReadouts();
  }

  function onPaddleHit() {
    ball.hits++;
    if (ball.hits % SPEEDUP_EVERY === 0) {
      ball.mult = Math.min(ball.mult * SPEEDUP_FACTOR, MAX_MULT);
      const sx = ball.sx > 0 ? 1 : -1;
      const sy = ball.sy > 0 ? 1 : -1;
      ball.sx = sx * BASE_SPEED * ball.mult;
      ball.sy = sy * BASE_SPEED * ball.mult;
    }
    updateReadouts();
  }

  function updateReadouts() {
    rallyOut.textContent = ball.hits;
    speedOut.textContent = ball.mult.toFixed(2) + '×';
    const pct = ((ball.mult - 1) / (MAX_MULT - 1)) * 100;
    speedBar.style.width = Math.max(0, Math.min(100, pct)) + '%';
  }

  function clampPaddle(p) {
    if (p.y < 0) p.y = 0;
    if (p.y > H - PH) p.y = H - PH;
  }

  function overlaps(bx, by, p) {
    return bx < p.x + PW && bx + BS > p.x && by < p.y + PH && by + BS > p.y;
  }

  function step() {
    // paddles
    if (touch.left !== null) left.y = touch.left - PH/2;
    else {
      if (keys['w']) left.y -= PADDLE_SPEED;
      if (keys['s']) left.y += PADDLE_SPEED;
    }
    if (touch.right !== null) right.y = touch.right - PH/2;
    else {
      if (keys['arrowup'])   right.y -= PADDLE_SPEED;
      if (keys['arrowdown']) right.y += PADDLE_SPEED;
    }
    clampPaddle(left);
    clampPaddle(right);

    // ball
    ball.x += ball.sx;
    ball.y += ball.sy;

    if (ball.y <= 0) { ball.y = 0; ball.sy = Math.abs(ball.sy); }
    else if (ball.y + BS >= H) { ball.y = H - BS; ball.sy = -Math.abs(ball.sy); }

    if (ball.sx < 0 && overlaps(ball.x, ball.y, left)) {
      ball.x = left.x + PW;
      ball.sx = Math.abs(ball.sx);
      onPaddleHit();
    } else if (ball.sx > 0 && overlaps(ball.x, ball.y, right)) {
      ball.x = right.x - BS;
      ball.sx = -Math.abs(ball.sx);
      onPaddleHit();
    }

    if (ball.x + BS <= 0) { scoreR++; point(1); }
    else if (ball.x >= W) { scoreL++; point(-1); }
  }

  function point(dir) {
    if (scoreL >= WIN_SCORE || scoreR >= WIN_SCORE) {
      over = true;
      running = false;
      const who = scoreL > scoreR ? 'Left player' : 'Right player';
      overlayText.textContent = `${who} wins it, ${Math.max(scoreL,scoreR)} to ${Math.min(scoreL,scoreR)}.`;
      startBtn.textContent = 'Play again';
      overlay.hidden = false;
      startBtn.focus();
    }
    resetBall(dir);
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    for (let y = 0; y < H; y += 30) ctx.fillRect(W/2 - 2, y, 4, 15);

    ctx.fillRect(left.x, left.y, PW, PH);
    ctx.fillRect(right.x, right.y, PW, PH);

    ctx.beginPath();
    ctx.ellipse(ball.x + BS/2, ball.y + BS/2, BS/2, BS/2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = '700 64px Archivo, Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(scoreL, W/4, 24);
    ctx.fillText(scoreR, 3*W/4, 24);
  }

  // fixed 60Hz accumulator so the ball can't tunnel on a slow frame
  const TICK = 1000/60;
  let last = performance.now(), acc = 0;

  function loop(now) {
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= TICK) {
      if (running) step();
      acc -= TICK;
    }
    draw();
    requestAnimationFrame(loop);
  }

  // input
  const TRACKED = ['w','s','arrowup','arrowdown'];
  function markKey(k, on) {
    const el = document.querySelector(`.key[data-key="${k}"]`);
    if (el) el.classList.toggle('live', on);
  }
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (TRACKED.includes(k)) { e.preventDefault(); keys[k] = true; markKey(k, true); }
    if (k === ' ' && !over) { e.preventDefault(); togglePause(); }
  });
  addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (TRACKED.includes(k)) { keys[k] = false; markKey(k, false); }
  });
  addEventListener('blur', () => {
    for (const k of TRACKED) { keys[k] = false; markKey(k, false); }
    if (running) pause();
  });

  function canvasY(clientY) {
    const r = canvas.getBoundingClientRect();
    return (clientY - r.top) / r.height * H;
  }
  function handlePointer(e) {
    if (!running) return;
    const r = canvas.getBoundingClientRect();
    for (const p of e.getCoalescedEvents ? [e] : [e]) {
      const side = (p.clientX - r.left) < r.width/2 ? 'left' : 'right';
      touch[side] = canvasY(p.clientY);
    }
  }
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); handlePointer(e); });
  canvas.addEventListener('pointermove', handlePointer);
  canvas.addEventListener('pointerup', () => { touch.left = touch.right = null; });
  canvas.addEventListener('pointercancel', () => { touch.left = touch.right = null; });

  function pause() {
    running = false;
    overlayText.textContent = 'Paused. Press space or use the button to pick the rally back up.';
    startBtn.textContent = 'Resume';
    overlay.hidden = false;
  }
  function togglePause() {
    if (running) pause(); else start();
  }
  function start() {
    if (over) {
      scoreL = scoreR = 0;
      over = false;
      resetBall();
    }
    overlay.hidden = true;
    running = true;
    last = performance.now();
    acc = 0;
    canvas.focus();
  }

  startBtn.addEventListener('click', start);

  resetBall();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
